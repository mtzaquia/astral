name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
      - "Package.swift"
  push:
    branches:
      - main
    paths:
      - "Sources/**/*.swift"
      - "Tests/**/*.swift"
      - "Package.swift"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - name: Run tests
        run: swift test

      - name: Build release configuration
        run: swift build --configuration release
